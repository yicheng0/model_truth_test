services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claude_eval
      POSTGRES_USER: ${POSTGRES_USER:-claude_eval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claude_eval}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claude_eval -d claude_eval"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://claude_eval:claude_eval@postgres:5432/claude_eval}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      AUTO_SCHEDULER_ENABLED: ${AUTO_SCHEDULER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
